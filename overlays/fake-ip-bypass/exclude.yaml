version: 1
ruleset: fake-ip-bypass
format: selectors
selectors:
  - kind: opaque_domain
    value: 'Mijia Cloud'
    source_id: shellcrash-fakeip
    reason: ShellCrash treats this as a sniffer skip-domain marker and excludes it from DNS rules.
  # Legacy DustinWin regular expressions may survive in an unavailable-source
  # snapshot. Current endpoint/wildcard membership is excluded via ruleset stun.
  - kind: domain_regex
    value: '^.*\.stun\.[^.]+\.[^.]+$'
    reason: Legacy STUN bypass expression; STUN is now a standalone ruleset.
  - kind: domain_regex
    value: '^.*\.stun\.[^.]+\.[^.]+\.[^.]+$'
    reason: Legacy STUN bypass expression; STUN is now a standalone ruleset.
  - kind: domain_regex
    value: '^.*\.stun\.[^.]+\.[^.]+\.[^.]+\.[^.]+$'
    reason: Legacy STUN bypass expression; STUN is now a standalone ruleset.
  - kind: domain_regex
    value: '^.*\.stun\.[^.]+\.[^.]+\.[^.]+\.[^.]+\.[^.]+$'
    reason: Legacy STUN bypass expression; STUN is now a standalone ruleset.
