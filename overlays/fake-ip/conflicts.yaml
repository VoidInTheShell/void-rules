    winner: fake-ip-bypass
    reason: Blizzard game connectivity is compatibility-sensitive even when traffic later uses GlobalGames.
  - kind: domain_suffix
    value: steamcontent.com
    winner: fake-ip-bypass
    reason: Steam content delivery is explicitly classified for direct download compatibility.
  - kind: domain_suffix
    value: steamserver.net
    winner: fake-ip-bypass
    reason: Steam server discovery must retain real DNS answers for direct download compatibility.
  - kind: domain_suffix
    value: steamusercontent.com
    winner: fake-ip-bypass
    reason: Steam user-content delivery follows the real-IP game content policy.
  - kind: domain_suffix
    value: wargaming.net
    winner: fake-ip-bypass
    reason: Wargaming login and game connectivity are explicitly covered by Fake-IP compatibility sources.
  - kind: domain_suffix
    value: xboxlive.cn
    winner: fake-ip-bypass
    reason: Mainland Xbox connectivity and content delivery are direct compatibility dependencies.
  - kind: domain_suffix
    value: xboxlive.com
    winner: fake-ip-bypass
    reason: Xbox connectivity and game services are explicitly covered by Fake-IP compatibility sources.

  # Media services already carried explicit real-IP exceptions in the current
  # templates; routing can still select a proxy after DNS resolution.
  - kind: domain_suffix
    value: joox.com
    winner: fake-ip-bypass
    reason: JOOX is a Tencent media compatibility rule and follows the current direct-side Fake-IP exclusion.
  - kind: domain_suffix
    value: nflxvideo.net
    winner: fake-ip-bypass
    reason: Current templates explicitly require real DNS for Netflix video CDN while traffic may still use the streaming policy.

  - kind: domain_suffix
    value: cmbchina.com
    winner: fake-ip-bypass
    reason: Mainland CMB login and app compatibility explicitly requires real IP in blacklist mode.
  - kind: domain_suffix
    value: cmbimg.com
    winner: fake-ip-bypass
    reason: CMB static/login dependency follows the compatibility rule.

