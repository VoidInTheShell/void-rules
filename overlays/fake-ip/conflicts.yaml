version: 1
ruleset: fake-ip-bypass
format: conflicts
allow:
  # Connectivity and time probes must see real DNS answers.
  - kind: domain_suffix
    value: msftconnecttest.com
    winner: fake-ip-bypass
    reason: Microsoft connectivity detection is compatibility-sensitive and must use a real IP.
  - kind: domain_suffix
    value: msftncsi.com
    winner: fake-ip-bypass
    reason: Microsoft NCSI is a connectivity probe and must use a real IP.
  - kind: domain_suffix
    value: pool.ntp.org
    winner: fake-ip-bypass
    reason: NTP discovery is a direct time-service dependency and must not receive Fake-IP.
  - kind: domain_suffix
    value: ts.net
    winner: fake-ip-bypass
    reason: Tailscale MagicDNS names are private-network compatibility data and require real resolution.

  # Existing templates and dedicated compatibility sources intentionally keep
  # game login, launcher and download/CDN names out of Fake-IP.
  - kind: domain_suffix
    value: battle.net
    winner: fake-ip-bypass
    reason: Battle.net login and launcher compatibility takes precedence over broad proxy geolocation lists.
  - kind: domain_suffix
    value: blizzard.com
    winner: fake-ip-bypass
    reason: Blizzard launcher and game services are explicitly present in the compatibility source.
  - kind: domain_suffix
    value: blizzardgearstore.com
    winner: fake-ip-bypass
    reason: Keep the complete Blizzard compatibility family on real DNS answers.
  - kind: domain_suffix
    value: blz-contentstack.com
    winner: fake-ip-bypass
    reason: Blizzard content dependencies follow the launcher compatibility decision.
  - kind: domain_suffix
    value: diablo3.com
    winner: fake-ip-bypass
    reason: Blizzard game connectivity is compatibility-sensitive even when traffic later uses GlobalGames.
