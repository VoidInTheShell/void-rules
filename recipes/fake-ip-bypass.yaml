action: fake_ip_bypass
sources:
  - dustinwin-fakeip
  - rfm-fakeip
  - quixotic-fakeip
  - shellcrash-fakeip
  - metacubex-connectivity-check
  - metacubex-private
  - metacubex-games-cn
  - blackmatrix-netease
  - blackmatrix-tencent
  - blackmatrix-meituan
  - blackmatrix-blizzard
rulesets: []
include: overlays/fake-ip-bypass/include.yaml
exclude: overlays/fake-ip-bypass/exclude.yaml
assertions: overlays/fake-ip-bypass/assertions.yaml
conflict_resolutions: overlays/fake-ip/conflicts.yaml
outputs:
