version: 1
id: ads
description: Advertising and tracking rules with block and allow polarity preserved.
action: block
sources:
  - loyalsoldier-reject
  - snapei-reject
  - awavenue-ads
  - metacubex-ads
rulesets: []
include: overlays/ads/include.yaml
exclude: overlays/ads/exclude.yaml
assertions: overlays/ads/assertions.yaml
outputs:
  - jsonl
  - plain-domain
  - plain-ip
  - mihomo-classical-yaml
  - mihomo-classical-text
  - mihomo-domain-yaml
  - mihomo-domain-text
  - mihomo-domain-mrs
  - mihomo-ipcidr-yaml
  - mihomo-ipcidr-text
  - mihomo-ipcidr-mrs
  - adguard-block
  - adguard-allow
  - xray-domain-list
  - xray-geosite-dat
  - xray-geoip-dat
limits: {min_rules: 1000, max_rules: 5000000, max_growth_ratio: 3.0, max_shrink_ratio: 0.5}
