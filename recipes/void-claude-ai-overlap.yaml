version: 1
id: void-claude-ai-overlap
description: Intersect domain coverage from the generated Claude and AI rule sets, for ordered Claude DNS precedence.
action: match
sources: []
rulesets: []
intersect_rulesets:
  - ai
  - void-claude-rules
intersection_kinds:
  - domain
  - domain_suffix
  - domain_wildcard
include: overlays/void-claude-ai-overlap/include.yaml
exclude: overlays/void-claude-ai-overlap/exclude.yaml
assertions: overlays/void-claude-ai-overlap/assertions.yaml
outputs:
  - jsonl
  - plain-domain
  - mihomo-domain-yaml
  - mihomo-domain-text
  - mihomo-domain-mrs
  - xray-domain-list
limits: {min_rules: 5, max_rules: 1000, max_growth_ratio: 3.0, max_shrink_ratio: 0.5}
notes: Generated from current ai and void-claude-rules domain coverage, including parent/child and whole-label wildcard overlaps; consumers should not hardcode its members.
