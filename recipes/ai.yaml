version: 1
id: ai
description: Mainstream global AI services from MetaCubeX and blackmatrix7 with local fallback roots.
action: match
sources:
  - metacubex-ai-not-cn
  - blackmatrix-openai
  - blackmatrix-twitter
  - blackmatrix-claude
rulesets: []
include: overlays/ai/include.yaml
exclude: overlays/ai/exclude.yaml
assertions: overlays/ai/assertions.yaml
outputs:
  - jsonl
  - plain-domain
  - plain-ip
  - mihomo-classical-yaml
  - mihomo-classical-text
  - mihomo-domain-yaml
  - mihomo-domain-text
  - mihomo-domain-mrs
  - mihomo-ipcidr-yaml
  - mihomo-ipcidr-text
  - mihomo-ipcidr-mrs
  - xray-domain-list
  - xray-geosite-dat
  - xray-geoip-dat
limits: {min_rules: 20, max_rules: 500000, max_growth_ratio: 5.0, max_shrink_ratio: 0.3}
