version: 1
id: void-claude-rules
description: Anthropic and Claude rules merged from VPSDance, MetaCubeX, xiaolai and blackmatrix7.
action: match
sources:
  - vpsdance-anthropic
  - metacubex-anthropic
  - xiaolai-anthropic
  - blackmatrix-claude
rulesets: []
include: overlays/void-claude-rules/include.yaml
exclude: overlays/void-claude-rules/exclude.yaml
assertions: overlays/void-claude-rules/assertions.yaml
outputs:
  - jsonl
  - plain-domain
  - plain-ip
  - mihomo-classical-yaml
  - mihomo-classical-text
  - mihomo-domain-yaml
  - mihomo-domain-text
  - mihomo-domain-mrs
  - mihomo-ipcidr-yaml
  - mihomo-ipcidr-text
  - mihomo-ipcidr-mrs
  - xray-domain-list
  - xray-geosite-dat
  - xray-geoip-dat
limits: {min_rules: 25, max_rules: 50000, max_growth_ratio: 4.0, max_shrink_ratio: 0.5}
notes: Preserve shared-service and process rules. Classical is the complete routing output; domain and IP formats are projections. Identical semantic rules merge provenance without dropping covered subdomains or CIDRs from the canonical set.
