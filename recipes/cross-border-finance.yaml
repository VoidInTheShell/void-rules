version: 1
id: cross-border-finance
description: Global banks, payments, brokers, exchanges, crypto platforms, carriers and regional probes.
action: match
sources:
  - void-finance-fallback
  - metacubex-finance
  - metacubex-cryptocurrency
rulesets: []
include: overlays/cross-border-finance/include.yaml
exclude: overlays/cross-border-finance/exclude.yaml
assertions: overlays/cross-border-finance/assertions.yaml
domain_keyword_fallback:
  min_label_length: 4
  always_include:
    - a1
    - anz
    - asx
    - b3
    - bmo
    - cex
    - dbs
    - dnb
    - htx
    - jcb
    - jpx
    - jse
    - krx
    - m1
    - mtn
    - n26
    - o2
    - okx
    - rbs
    - scb
    - seb
    - sgx
    - stc
    - tmx
    - tsx
    - vtb
    - xtb
    - zb
  exclude:
    - account
    - accounts
    - ads
    - app
    - apps
    - asset
    - assets
    - auth
    - blog
    - cash
    - cdn
    - client
    - cloud
    - crypto
    - edu
    - global
    - help
    - home
    - international
    - intl
    - login
    - mobile
    - online
    - pay
    - payment
    - payments
    - portal
    - prod
    - production
    - secure
    - static
    - stream
    - support
    - web
    - www
outputs:
  - jsonl
  - plain-domain
  - mihomo-classical-yaml
  - mihomo-classical-text
  - mihomo-domain-yaml
  - mihomo-domain-text
  - mihomo-domain-mrs
  - xray-domain-list
  - xray-geosite-dat
limits: {min_rules: 500, max_rules: 2000000, max_growth_ratio: 4.0, max_shrink_ratio: 0.5}
