version: 1
id: stun
description: Standalone STUN/TURN rules synchronized from MetaCubeX and four mixed upstreams, with protected legacy rules.
action: match
sources:
  - metacubex-stun
  - dustinwin-fakeip
  - rfm-fakeip
  - quixotic-fakeip
  - shellcrash-fakeip
filtered_sources: [dustinwin-fakeip, rfm-fakeip, quixotic-fakeip, shellcrash-fakeip]
source_filter: stun-turn
review_unmatched_sources: [dustinwin-fakeip]
rulesets: []
include: overlays/stun/include.yaml
exclude: overlays/stun/exclude.yaml
assertions: overlays/stun/assertions.yaml
outputs:
  - jsonl
  - plain-domain
  - mihomo-classical-yaml
  - mihomo-classical-text
  - mihomo-domain-yaml
  - mihomo-domain-text
  - mihomo-domain-mrs
  - xray-domain-list
  - xray-geosite-dat
limits: {min_rules: 100, max_rules: 50000, max_growth_ratio: 4.0, max_shrink_ratio: 0.5}
notes: Select mixed-source STUN/TURN rules using current MetaCubeX membership, explicit STUN/TURN labels and protected legacy rules. Merge with all source records intact; upstream-only additions and deletions propagate automatically. Newly unmatched DustinWin rules require review before publication. Existing NTP and other bypass rules remain outside this set. Independent output only, not included in fake-ip-force; broader parent rules and client defaults still apply.
